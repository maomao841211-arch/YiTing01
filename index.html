<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>609｜課堂記分</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#183b36;background:#f3f6f2}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:32px 20px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:3px;color:#67847b}h1{font-size:30px;margin:7px 0}p{color:#688078;font-size:14px;margin:8px 0}.tools{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #d4e0d8;border-radius:10px;background:white;color:#234c42;padding:10px 14px}button:hover{background:#eaf2ed}button:focus-visible{outline:3px solid #d49b46;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.panel{background:white;border:1px solid #dce5dd;border-radius:22px;padding:24px;box-shadow:0 8px 30px #294a3510}.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h2{margin:0;font-size:19px}.badge{font-size:12px;color:#58816f;background:#edf5ee;padding:7px 12px;border-radius:30px}.room{display:grid;grid-template-columns:1fr 1fr;gap:22px 36px}.group{display:grid;grid-template-columns:1fr .65fr 1fr;grid-template-rows:repeat(3,minmax(104px,auto));gap:7px}.table{grid-column:2;grid-row:1/4;display:flex;align-items:center;justify-content:center;background:#edf1e9;border:1px solid #dce3d4;border-radius:12px;writing-mode:vertical-rl;letter-spacing:5px;color:#7b8972;font-size:14px}.seat{background:#f7faf7;border:1px solid #dce8df;border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}.seat-top{display:flex;justify-content:space-between;align-items:center;gap:5px}.number{font-size:23px;font-weight:700}.number small{font-size:11px;font-weight:400;color:#84938a;margin-left:3px}.score{font-weight:650;color:#667a70;font-size:18px}.score.positive{color:#19815b}.score.negative{color:#b6504f}.actions{display:flex;gap:6px}.actions button{white-space:nowrap;width:50%;padding:6px 2px;font-weight:700;background:#e4f1e8;color:#26704c;border:0}.actions .minus{background:#faece8;color:#af6254}.empty{border:1px dashed #e1e6de;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#a9b2a5;font-size:12px}.podium{margin:25px auto 0;background:#254e43;color:white;max-width:350px;text-align:center;padding:15px;border-radius:12px;letter-spacing:5px}.rear{text-align:center;color:#98a399;font-size:12px;margin-bottom:16px;letter-spacing:3px}.board{margin-top:24px}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:13px;color:#7d8e84;background:#f6f8f4}td,th{padding:12px 20px;border-bottom:1px solid #edf1ea}td:nth-child(2){font-weight:650}#notice{min-height:22px;color:#42765c;font-size:13px;margin:12px 0 0}footer{text-align:center;margin-top:22px;color:#89978d;font-size:12px}@media(max-width:650px){main{padding:20px 12px}header{display:block}.tools{margin-top:16px}.panel{padding:15px}.room{gap:18px 10px}.group{grid-template-columns:1fr 25px 1fr;gap:4px;grid-template-rows:repeat(3,minmax(95px,auto))}.seat{padding:6px}.number{font-size:19px}.number small{display:none}.score{font-size:15px}.actions{gap:3px}.actions button{font-size:12px}.table{font-size:12px;letter-spacing:3px}h1{font-size:27px}}
</style></head><body><main>
<header><div><div class="eyebrow">CLASSROOM · 115-1</div><h1>609 課堂記分</h1><p>點選座位上的 ＋ 或 －，即時記錄每一份表現。</p></div><div class="tools"><button id="undo" disabled>↶ 復原</button><button id="export">匯出分數</button><button id="reset">全部清零</button></div></header>
<section class="panel"><div class="section-heading"><h2>班級座位表</h2><span class="badge">24 位學生</span></div><div class="rear">教室後方</div><div class="room" id="room"></div><div class="podium">講台 · 609</div><p id="notice" role="status" aria-live="polite">分數自動保存在此瀏覽器。</p></section>
<section class="panel board"><div class="section-heading"><h2>記分板</h2><span class="badge">依座號排列</span></div><table><thead><tr><th scope="col">座號</th><th scope="col">累計分數</th></tr></thead><tbody id="scores"></tbody></table></section><footer>依據 609 座位表製作 · 分數僅儲存於目前裝置與瀏覽器</footer>
</main><script>
const KEY='class609.scores.v1';
const groups=[{"name": "第三組", "left": [null, 8, 3], "right": [null, null, null]}, {"name": "器材桌", "left": [null, null, null], "right": [null, null, null]}, {"name": "第二組", "left": [12, 7, 2], "right": [null, 13, 17]}, {"name": "第五組", "left": [15, 10, 5], "right": [20, 19, 24]}, {"name": "第一組", "left": [11, 6, 1], "right": [18, 21, 16]}, {"name": "第四組", "left": [14, 9, 4], "right": [null, 23, 22]}];
const ids=groups.flatMap(g=>[...g.left,...g.right]).filter(n=>n!==null).sort((a,b)=>a-b);
let scores=Object.fromEntries(ids.map(n=>[n,0])),history=[];
let storageAvailable=true;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object')for(const n of ids)if(Number.isSafeInteger(saved[n]))scores[n]=saved[n];}catch{storageAvailable=false;}
const notice=document.getElementById('notice');
function persist(){try{localStorage.setItem(KEY,JSON.stringify(scores));storageAvailable=true;}catch{storageAvailable=false;}}
function render(){for(const n of ids){const value=scores[n];for(const el of document.querySelectorAll(`[data-score="${n}"]`)){el.textContent=value>0?'+'+value:String(value);el.className='score '+(value>0?'positive':value<0?'negative':'');}}document.getElementById('undo').disabled=history.length===0;}
function update(n,delta){if(!Number.isSafeInteger(scores[n]+delta))return;history.push({...scores});scores[n]+=delta;persist();render();notice.textContent=`${n} 號 ${delta>0?'加':'扣'} 1 分，累計 ${scores[n]} 分。`+(storageAvailable?' 已儲存。':' 瀏覽器無法儲存，請匯出備份。');}
for(const g of groups){const group=document.createElement('div');group.className='group';const table=document.createElement('div');table.className='table';table.textContent=g.name;group.append(table);for(const [column,values] of [[1,g.left],[3,g.right]])values.forEach((n,row)=>{const seat=document.createElement('div');seat.style.gridColumn=column;seat.style.gridRow=row+1;if(n===null){seat.className='empty';seat.textContent='空位';}else{seat.className='seat';seat.dataset.seat=n;seat.innerHTML=`<div class="seat-top"><span class="number">${n}<small>號</small></span><span class="score" data-score="${n}">0</span></div><div class="actions"><button type="button" aria-label="${n} 號加 1 分">＋1</button><button type="button" class="minus" aria-label="${n} 號扣 1 分">－1</button></div>`;seat.querySelectorAll('button').forEach((b,i)=>b.addEventListener('click',()=>update(n,i===0?1:-1)));}group.append(seat);});document.getElementById('room').append(group);}
for(const n of ids){const tr=document.createElement('tr');tr.innerHTML=`<td>${n}</td><td><span data-score="${n}" class="score">0</span></td>`;document.getElementById('scores').append(tr);}
document.getElementById('undo').onclick=()=>{if(!history.length)return;scores=history.pop();persist();render();notice.textContent=storageAvailable?'已復原上一個動作並儲存。':'已復原；瀏覽器無法儲存，請匯出備份。';};
document.getElementById('reset').onclick=()=>{if(!confirm('確定將所有座號的分數清零？可使用「復原」還原。'))return;history.push({...scores});scores=Object.fromEntries(ids.map(n=>[n,0]));persist();render();notice.textContent=storageAvailable?'所有分數已清零並儲存。':'所有分數已清零；瀏覽器無法儲存，請匯出備份。';};
document.getElementById('export').onclick=()=>{const csv='\uFEFF座號,累計分數\r\n'+ids.map(n=>`${n},${scores[n]}`).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='609課堂分數.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
render();if(!storageAvailable)notice.textContent='瀏覽器無法讀取儲存資料，本次分數請匯出備份。';
</script></body></html>
